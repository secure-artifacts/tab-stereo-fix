name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Test
        run: python -m desktop.check_app

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build folder
        run: python scripts/make_bundle.py

      - name: Package
        run: python scripts/make_zip.py

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/TabStereoFix-*.zip'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TabStereoFix-*.zip
          generate_release_notes: true
