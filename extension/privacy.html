<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>隐私说明</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
      body { margin: 0; background: #f4f7fb; color: #102033; }
      main { max-width: 720px; margin: 0 auto; padding: 32px 20px 48px; line-height: 1.65; }
      h1 { margin: 0 0 8px; }
      h2 { margin: 24px 0 8px; font-size: 18px; }
      .lead, li { color: #334155; }
      .card { background: white; border: 1px solid #d7e2ee; border-radius: 14px; padding: 16px 18px; }
    </style>
  </head>
  <body>
    <main>
      <h1>隐私说明</h1>
      <p class="lead">浏览器立体声修复是本地插件。没有服务器，不注册账号，也不会把网页内容或个人信息送出去。</p>
      <div class="card">
        <h2>不会做的事</h2>
        <ul>
          <li>不联网，不访问任何远程地址</li>
          <li>不读取、不保存、不上传网页正文、表单、密码、Cookie、聊天记录</li>
          <li>不把声音传到别的电脑，也不录音</li>
          <li>不统计、不追踪、不插入广告</li>
        </ul>
        <h2>会做的事</h2>
        <ul>
          <li>只在你点「开始传播」后，捕获当前这个浏览器用户下各标签页的声音，并在本机重新播放</li>
          <li>顺带把网页申请麦克风时的回声消除关掉，减少 Wide Echo Cancellation 再次吃掉声音</li>
          <li>本机只记住是否正在传播、输出设备，以及标签标题</li>
        </ul>
      </div>
    </main>
  </body>
</html>
